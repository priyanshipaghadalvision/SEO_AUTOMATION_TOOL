services:
  postgres:
    image: postgres:16-alpine
    container_name: seo-automation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seo
      POSTGRES_PASSWORD: seo_dev_password
      POSTGRES_DB: seo_automation
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo -d seo_automation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
